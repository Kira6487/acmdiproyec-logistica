<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/Login.css}">
    <title>Iniciar sesión | ACM Diproyec</title>
</head>
<body>
    <main class="login-page">
        <a th:href="@{/}" class="logo">ACM<span>Diproyec</span></a>
        <section class="login-box">
            <h1>Iniciar sesión</h1>
            <p class="mensaje-error" th:if="${param.error}">Correo o contraseña incorrectos.</p>
            <p class="mensaje-exito" th:if="${param.logout}">La sesión se cerró correctamente.</p>
            <form th:action="@{/login}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <label for="correo">Correo electrónico</label>
                <input id="correo" type="email" name="username" placeholder="Ingresa tu correo electrónico" required autofocus>
                <label for="password">Contraseña</label>
                <input id="password" type="password" name="password" placeholder="Ingresa tu contraseña" required>
                <button type="submit">Iniciar sesión</button>
            </form>
        </section>
    </main>
</body>
</html>

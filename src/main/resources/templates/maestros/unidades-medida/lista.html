<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Unidades de medida')}"></head>
<body>
<div class="acm-app">
  <aside th:replace="~{fragments/sidebar :: sidebar('unidades')}"></aside>

  <main class="acm-main" id="contenido-principal" tabindex="-1">
    <header class="acm-topbar">
      <div>
        <nav class="acm-breadcrumb" aria-label="Ruta de navegación">
          <ol>
            <li><a th:href="@{/panel}" href="/panel">Panel</a></li>
            <li>Datos maestros</li>
            <li>Unidades de medida</li>
          </ol>
        </nav>
        <h1>Unidades de medida</h1>
        <p class="acm-help">Definen cómo se cuantifican los productos del almacén.</p>
      </div>
      <div class="acm-actions" sec:authorize="hasAnyRole('ADMIN')">
        <a class="btn btn-primary" th:href="@{/unidades-medida/nuevo}"
           href="/unidades-medida/nuevo">Nueva unidad</a>
      </div>
    </header>

    <div th:replace="~{fragments/alerts :: alertas}"></div>

    <div class="card">
      <div class="card-body">
        <div class="table-responsive" th:if="${!unidadesMedida.isEmpty()}">
          <table class="table">
            <thead>
            <tr>
              <th scope="col">Código</th>
              <th scope="col">Nombre</th>
              <th scope="col">Abreviatura</th>
              <th scope="col">Estado</th>
              <th scope="col" sec:authorize="hasAnyRole('ADMIN')">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="unidad : ${unidadesMedida}">
              <td th:text="${unidad.codigo}">UNIDAD</td>
              <td th:text="${unidad.nombre}">Unidad</td>
              <td th:text="${unidad.abreviatura}">und</td>
              <td>
                <span class="badge"
                      th:classappend="${unidad.activo} ? 'acm-badge-success' : 'acm-badge-neutral'"
                      th:text="${unidad.activo} ? 'Activa' : 'Inactiva'">Activa</span>
              </td>
              <td sec:authorize="hasAnyRole('ADMIN')">
                <div class="acm-table-actions">
                  <a class="btn btn-sm btn-outline-light"
                     th:href="@{/unidades-medida/{id}/editar(id=${unidad.idUnidadMedida})}"
                     href="/unidades-medida/1/editar">Editar</a>
                  <form th:action="@{/unidades-medida/{id}/eliminar(id=${unidad.idUnidadMedida})}"
                        method="post"
                        onsubmit="return confirm('¿Eliminar esta unidad de medida? Esta acción no se puede deshacer.');">
                    <button type="submit" class="btn btn-sm btn-danger">Eliminar</button>
                  </form>
                </div>
              </td>
            </tr>
            </tbody>
          </table>
        </div>

        <div th:replace="~{fragments/empty-state :: vacio(
                'No hay unidades de medida registradas',
                'Aún no hay unidades disponibles en el sistema.',
                @{/unidades-medida/nuevo},
                'Registrar unidad')}"
             th:if="${unidadesMedida.isEmpty()}"></div>

        <p class="acm-table-note">
          Mostrando <span th:text="${#lists.size(unidadesMedida)}">0</span> unidades de medida.
        </p>
      </div>
    </div>
  </main>
</div>
</body>
</html>

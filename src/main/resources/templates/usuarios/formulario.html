<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/Usuarios.css}">
    <title>Formulario de usuario | ACM Diproyec</title>
</head>
<body>
    <main class="usuario-card">
        <h1 th:text="${usuario.idUsuario == null ? 'Nuevo usuario' : 'Editar usuario'}"></h1>
        <form class="usuario-form" th:action="${usuario.idUsuario == null ? '/usuarios' : '/usuarios/' + usuario.idUsuario}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label for="codigo">Código</label>
            <input id="codigo" name="codigo" th:value="${usuario.codigo}" required>
            <label for="nombres">Nombres</label>
            <input id="nombres" name="nombres" th:value="${usuario.nombres}" required>
            <label for="apellidos">Apellidos</label>
            <input id="apellidos" name="apellidos" th:value="${usuario.apellidos}" required>
            <label for="correo">Correo</label>
            <input id="correo" type="email" name="correo" th:value="${usuario.correo}" required>
            <label for="password">Contraseña</label>
            <input id="password" type="password" name="password" th:required="${usuario.idUsuario == null}">
            <label for="idRol">Rol</label>
            <select id="idRol" name="idRol" required>
                <option value="">Seleccione un rol</option>
                <option th:each="rol : ${roles}" th:value="${rol.idRol}" th:text="${rol.nombre}"
                        th:selected="${usuario.idRol == rol.idRol}"></option>
            </select>
            <label class="activo">
                <input type="checkbox" name="activo" value="true" th:checked="${usuario.idUsuario == null or usuario.activo}">
                Activo
            </label>
            <div class="usuario-actions">
                <button type="submit">Guardar</button>
                <a class="usuarios-link" th:href="@{/usuarios}">Cancelar</a>
            </div>
        </form>
    </main>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Página web base">
    <link rel="stylesheet" href="/css/index.css">
	<title>ACM Diproyec</title>
</head>
<body>
	<header class="navbar">
        <a href="#" class="logo">
            <img th:src="@{/imagenes/ACM Diproyec.jpeg}" alt="Logo de ACM Diproyec">
        </a>

		<nav>
            <a href="#inicio">Inicio</a>
            <a sec:authorize="hasAnyRole('ADMINISTRACION', 'ADMIN', 'LOGISTICA', 'SISTEMAS', 'SISTEMA')" href="/dashboard">Dashboard</a>
            <a sec:authorize="hasAnyRole('ADMINISTRACION', 'ADMIN', 'LOGISTICA', 'SISTEMAS', 'SISTEMA')" href="/inventario">Consulta de stock</a>
            <a sec:authorize="hasAnyRole('SISTEMAS', 'SISTEMA')" href="/usuarios">Usuarios</a>
            <a sec:authorize="hasAnyRole('LOGISTICA', 'SISTEMAS', 'SISTEMA')" href="/movimientos">Movimientos</a>
		</nav>

        <form sec:authorize="isAuthenticated()" action="/logout" method="post">
            <input type="hidden"
                th:name="${_csrf.parameterName}"
                th:value="${_csrf.token}">
            <button type="submit" class="boton-login">Cerrar sesión</button>
        </form>
	</header>

	<main id="inicio">
		<section class="hero">
            <div class="hero-texto">
                <p class="etiqueta">ACM DIPROYEC</p>
                <h1>Diseño y construcción para grandes proyectos</h1>
                <p>
                    Creamos soluciones profesionales para empresas de construcción, remodelación y desarrollo inmobiliario.
                </p>
            </div>
            <div class="hero-imagen">
                <img th:src="@{/imagenes/Moderna-casa-de-dos-pisos.jpg}" alt="Proyecto de construcción">
            </div>
        </section>
	</main>

	<footer id="contacto">
		<small>&copy; 2026 ACM Diproyec. Todos los derechos reservados.</small>
	</footer>
</body>
</html>

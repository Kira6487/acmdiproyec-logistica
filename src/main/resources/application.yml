spring:
  application:
    name: acmdiproyec-logistica
  datasource:
    # Conexión directa a PostgreSQL/Supabase.
    #
    # CONTRASEÑA: se toma exclusivamente de la variable de entorno
    # SUPABASE_DB_PASSWORD y no admite valor predeterminado. Si falta, la
    # aplicación no arranca. Nunca se escribe en este archivo, en commits,
    # pruebas, documentación ni registros.
    #
    # DESTINO: dos formas equivalentes.
    #   1. Recomendada: SUPABASE_DB_HOST, SUPABASE_DB_PORT y SUPABASE_DB_NAME.
    #      Sus valores predeterminados son los parámetros de conexión directa
    #      del entorno de pruebas y son no sensibles.
    #   2. Alternativa: SUPABASE_DB_URL con la cadena JDBC completa. Se
    #      conserva por compatibilidad con el resto del proyecto. En ese caso
    #      incluya siempre sslmode=require.
    # USUARIO: SUPABASE_DB_USER (predeterminado: postgres).
    #
    # Por seguridad, la URL JDBC nunca lleva usuario ni contraseña embebidos
    # y la forma recomendada impone sslmode=require de forma ineludible.
    url: ${SUPABASE_DB_URL:jdbc:postgresql://${SUPABASE_DB_HOST:db.tqeiokeqjwwdkafsjmoi.supabase.co}:${SUPABASE_DB_PORT:5432}/${SUPABASE_DB_NAME:postgres}?sslmode=require}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      validation-timeout: 5000
      pool-name: LogisticaHikariPool

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

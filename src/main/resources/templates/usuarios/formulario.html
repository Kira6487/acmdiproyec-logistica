<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Usuarios')}"></head>
<body>
<div class="acm-app">
  <aside th:replace="~{fragments/sidebar :: sidebar('usuarios')}"></aside>

  <main class="acm-main" id="contenido-principal" tabindex="-1">
    <header class="acm-topbar">
      <div>
        <nav class="acm-breadcrumb" aria-label="Ruta de navegación">
          <ol>
            <li><a th:href="@{/panel}" href="/panel">Panel</a></li>
            <li><a th:href="@{/usuarios}" href="/usuarios">Usuarios</a></li>
            <li th:text="${tituloFormulario}">Formulario</li>
          </ol>
        </nav>
        <h1 th:text="${tituloFormulario}">Nuevo usuario</h1>
        <p class="acm-help">Los campos marcados con * son obligatorios.</p>
      </div>
      <div class="acm-actions">
        <a class="btn btn-outline-secondary" th:href="@{/usuarios}" href="/usuarios">Volver al listado</a>
      </div>
    </header>

    <div th:replace="~{fragments/alerts :: alertas}"></div>

    <form class="card" th:object="${usuario}"
          th:action="${usuario.idUsuario != null} ? @{/usuarios/{id}(id=${usuario.idUsuario})} : @{/usuarios}"
          method="post">
      <div class="card-body">
        <div class="row g-3">
          <div class="col-12">
            <div class="alert alert-danger" role="alert"
                 th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}"></div>
          </div>

          <input type="hidden" th:field="*{idUsuario}">

          <div class="col-12 col-md-6">
            <label class="form-label" for="nombres">Nombres *</label>
            <input class="form-control" type="text" id="nombres" th:field="*{nombres}"
                   maxlength="100" autocomplete="given-name" required>
            <p class="alert alert-danger" th:if="${#fields.hasErrors('nombres')}"
               th:errors="*{nombres}"></p>
          </div>

          <div class="col-12 col-md-6">
            <label class="form-label" for="apellidos">Apellidos *</label>
            <input class="form-control" type="text" id="apellidos" th:field="*{apellidos}"
                   maxlength="100" autocomplete="family-name" required>
            <p class="alert alert-danger" th:if="${#fields.hasErrors('apellidos')}"
               th:errors="*{apellidos}"></p>
          </div>

          <div class="col-12 col-md-4">
            <label class="form-label" for="codigo">Código *</label>
            <input class="form-control" type="text" id="codigo" th:field="*{codigo}"
                   maxlength="30" autocomplete="off" required>
            <p class="alert alert-danger" th:if="${#fields.hasErrors('codigo')}"
               th:errors="*{codigo}"></p>
          </div>

          <div class="col-12 col-md-8">
            <label class="form-label" for="correo">Correo electrónico *</label>
            <input class="form-control" type="email" id="correo" th:field="*{correo}"
                   maxlength="254" autocomplete="email" required>
            <p class="acm-help">Se usa como usuario para iniciar sesión.</p>
            <p class="alert alert-danger" th:if="${#fields.hasErrors('correo')}"
               th:errors="*{correo}"></p>
          </div>

          <div class="col-12 col-md-6">
            <label class="form-label" for="idRol">Rol *</label>
            <select class="form-select" id="idRol" th:field="*{idRol}" required>
              <option value="">Seleccione un rol</option>
              <option th:each="rol : ${roles}" th:value="${rol.idRol}"
                      th:text="${rol.nombre}">Rol</option>
            </select>
            <p class="alert alert-danger" th:if="${#fields.hasErrors('idRol')}"
               th:errors="*{idRol}"></p>
          </div>

          <div class="col-12 col-md-6">
            <label class="form-label" for="password">Contraseña *</label>
            <input class="form-control" type="password" id="password" th:field="*{password}"
                   autocomplete="new-password" required>
            <p class="acm-help">Cada persona usa su cuenta individual.</p>
            <p class="alert alert-danger" th:if="${#fields.hasErrors('password')}"
               th:errors="*{password}"></p>
          </div>

          <div class="col-12 col-md-4">
            <label class="form-label" for="activo">Estado</label>
            <select class="form-select" id="activo" th:field="*{activo}">
              <option value="true">Activo</option>
              <option value="false">Inactivo</option>
            </select>
            <p class="acm-help">Un usuario inactivo no puede iniciar sesión.</p>
          </div>

          <div class="col-12">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a class="btn btn-outline-secondary" th:href="@{/usuarios}" href="/usuarios">Cancelar</a>
          </div>
        </div>
      </div>
    </form>
  </main>
</div>
</body>
</html>

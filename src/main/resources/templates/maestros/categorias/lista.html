<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Categorías')}"></head>
<body>
<div class="acm-app">
  <aside th:replace="~{fragments/sidebar :: sidebar('categorias')}"></aside>

  <main class="acm-main" id="contenido-principal" tabindex="-1">
    <header class="acm-topbar">
      <div>
        <nav class="acm-breadcrumb" aria-label="Ruta de navegación">
          <ol>
            <li><a th:href="@{/panel}" href="/panel">Panel</a></li>
            <li>Datos maestros</li>
            <li>Categorías</li>
          </ol>
        </nav>
        <h1>Categorías de productos</h1>
        <p class="acm-help">
          Agrupan los productos del almacén y se usan al registrar cada producto.
        </p>
      </div>
      <div class="acm-actions" sec:authorize="hasAnyRole('ADMIN')">
        <a class="btn btn-primary" th:href="@{/categorias/nuevo}" href="/categorias/nuevo">Nueva categoría</a>
      </div>
    </header>

    <div th:replace="~{fragments/alerts :: alertas}"></div>

    <div class="card">
      <div class="card-body">
        <div class="table-responsive" th:if="${!categorias.isEmpty()}">
          <table class="table">
            <thead>
            <tr>
              <th scope="col">Código</th>
              <th scope="col">Nombre</th>
              <th scope="col">Descripción</th>
              <th scope="col">Estado</th>
              <th scope="col" sec:authorize="hasAnyRole('ADMIN')">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="categoria : ${categorias}">
              <td th:text="${categoria.codigo}">DADOS</td>
              <td th:text="${categoria.nombre}">Dados de concreto</td>
              <td th:text="${categoria.descripcion} ?: 'Sin descripción'">Sin descripción</td>
              <td>
                <span class="badge"
                      th:classappend="${categoria.activo} ? 'acm-badge-success' : 'acm-badge-neutral'"
                      th:text="${categoria.activo} ? 'Activa' : 'Inactiva'">Activa</span>
              </td>
              <td sec:authorize="hasAnyRole('ADMIN')">
                <div class="acm-table-actions">
                  <a class="btn btn-sm btn-outline-light"
                     th:href="@{/categorias/{id}/editar(id=${categoria.idCategoria})}"
                     href="/categorias/1/editar">Editar</a>
                  <form th:action="@{/categorias/{id}/eliminar(id=${categoria.idCategoria})}"
                        method="post"
                        onsubmit="return confirm('¿Eliminar esta categoría? Esta acción no se puede deshacer.');">
                    <button type="submit" class="btn btn-sm btn-danger">Eliminar</button>
                  </form>
                </div>
              </td>
            </tr>
            </tbody>
          </table>
        </div>

        <div th:replace="~{fragments/empty-state :: vacio(
                'No hay categorías registradas',
                'Aún no hay categorías disponibles en el sistema.',
                @{/categorias/nuevo},
                'Registrar categoría')}"
             th:if="${categorias.isEmpty()}"></div>

        <p class="acm-table-note">
          Mostrando <span th:text="${#lists.size(categorias)}">0</span> categorías.
        </p>
      </div>
    </div>
  </main>
</div>
</body>
</html>

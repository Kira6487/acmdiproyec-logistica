<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Iniciar sesión en el Sistema Logístico ACM Diproyec">
  <title>Iniciar sesión</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}" href="/img/favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
  <link rel="stylesheet" th:href="@{/css/acm-theme.css}" href="/css/acm-theme.css">
</head>
<body>
<main class="acm-login-page">
  <section class="acm-login-card" aria-labelledby="login-title">
    <span class="acm-login-brand">ACM <span>Diproyec</span></span>
    <span class="acm-login-subtitle">Control logístico del almacén</span>

    <h1 id="login-title" class="visually-hidden">Iniciar sesión</h1>

    <div class="acm-login-error" role="alert" th:if="${param.error}">
      <p>Usuario o contraseña incorrectos.</p>
      <p>Revisa los datos e inténtalo de nuevo.</p>
    </div>

    <div class="alert alert-success" role="status" th:if="${param.logout}">
      Has cerrado la sesión correctamente.
    </div>

    <form action="/login" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

      <label for="username">Correo electrónico <span aria-hidden="true">*</span></label>
      <input class="form-control" id="username" name="username" type="email"
             autocomplete="username" placeholder="pchecka" required>

      <label for="password">Contraseña <span aria-hidden="true">*</span></label>
      <input class="form-control" id="password" name="password" type="password"
             autocomplete="current-password" placeholder="********" required>

      <p class="acm-login-help">Cada persona usa su cuenta individual.</p>

      <button class="btn btn-primary" type="submit">Iniciar sesión</button>
    </form>

    <p class="acm-login-footer">
      ¿Sin acceso o cuenta desactivada? Contacta al administrador técnico.
    </p>
  </section>
</main>
</body>
</html>

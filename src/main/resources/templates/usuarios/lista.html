<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Usuarios')}"></head>
<body>
<div class="acm-app">
  <aside th:replace="~{fragments/sidebar :: sidebar('usuarios')}"></aside>

  <main class="acm-main" id="contenido-principal" tabindex="-1">
    <header class="acm-topbar">
      <div>
        <nav class="acm-breadcrumb" aria-label="Ruta de navegación">
          <ol>
            <li><a th:href="@{/panel}" href="/panel">Panel</a></li>
            <li>Usuarios</li>
          </ol>
        </nav>
        <h1>Usuarios del sistema</h1>
        <p class="acm-help">
          Personas con acceso al sistema logístico. Cada cuenta es individual.
        </p>
      </div>
      <div class="acm-actions">
        <a class="btn btn-primary" th:href="@{/usuarios/nuevo}" href="/usuarios/nuevo">Nuevo usuario</a>
      </div>
    </header>

    <div th:replace="~{fragments/alerts :: alertas}"></div>

    <div class="card">
      <div class="card-body">
        <div class="table-responsive" th:if="${!usuarios.isEmpty()}">
          <table class="table">
            <thead>
            <tr>
              <th scope="col">Nombre</th>
              <th scope="col">Estado</th>
              <th scope="col">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="usuario : ${usuarios}">
              <td th:text="${usuario.nombres + ' ' + usuario.apellidos}">Nombre Apellido</td>
              <td>
                <span class="badge"
                      th:classappend="${usuario.activo} ? 'acm-badge-success' : 'acm-badge-neutral'"
                      th:text="${usuario.activo} ? 'Activo' : 'Inactivo'">Activo</span>
              </td>
              <td>
                <div class="acm-table-actions">
                  <a class="btn btn-sm btn-outline-light"
                     th:href="@{/usuarios/{id}(id=${usuario.idUsuario})}"
                     href="/usuarios/1">Ver</a>
                  <form th:if="${usuario.activo}"
                        th:action="@{/usuarios/{id}/desactivar(id=${usuario.idUsuario})}"
                        method="post"
                        onsubmit="return confirm('¿Desactivar este usuario? No podrá iniciar sesión.');">
                    <button type="submit" class="btn btn-sm btn-danger">Desactivar</button>
                  </form>
                </div>
              </td>
            </tr>
            </tbody>
          </table>
        </div>

        <div th:replace="~{fragments/empty-state :: vacio(
                'No hay usuarios registrados',
                'Aún no hay cuentas de usuario en el sistema.',
                @{/usuarios/nuevo},
                'Registrar usuario')}"
             th:if="${usuarios.isEmpty()}"></div>

        <p class="acm-table-note">
          Mostrando <span th:text="${#lists.size(usuarios)}">0</span> usuarios.
        </p>
      </div>
    </div>
  </main>
</div>
</body>
</html>

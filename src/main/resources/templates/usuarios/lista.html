<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/Usuarios.css}">
    <title>Usuarios | ACM Diproyec</title>
</head>
<body>
    <main class="usuarios-page">
        <header class="usuarios-header">
            <h1>Usuarios</h1>
            <div class="usuarios-actions">
                <a class="boton-accion" th:href="@{/usuarios/nuevo}">Nuevo usuario</a>
                <a class="boton-accion boton-secundario" th:href="@{/}">Volver</a>
            </div>
        </header>
        <div class="usuarios-table-wrap">
            <table>
                <thead><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Estado</th><th>Acciones</th></tr></thead>
                <tbody>
                    <tr th:each="usuario : ${usuarios}">
                        <td th:text="${usuario.nombres + ' ' + usuario.apellidos}"></td>
                        <td th:text="${usuario.correo}"></td>
                        <td th:text="${usuario.rolNombre}"></td>
                        <td th:text="${usuario.activo ? 'Activo' : 'Inactivo'}"></td>
                        <td class="acciones-usuario">
                            <a class="boton-accion boton-secundario" th:href="@{/usuarios/{id}(id=${usuario.idUsuario})}">Ver</a>
                            <form th:if="${usuario.activo}" th:action="@{/usuarios/{id}/desactivar(id=${usuario.idUsuario})}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button class="boton-accion boton-desactivar" type="submit">Desactivar</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
